<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha conta | PedidoFlow</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="topbar"><div class="container topbar-inner"><strong>🍔 PedidoFlow</strong><div><a href="index.html">Cardápio</a> · <button class="btn btn-light" onclick="logout()">Sair</button></div></div></div>
<main class="container" style="padding-top:20px"><div class="card"><div class="muted">Conta do cliente</div><h1 id="customerName">Carregando...</h1><p id="customerPhone" class="muted"></p></div>
<div class="card"><div class="row"><h2>Seus pedidos</h2><a class="btn btn-primary" href="index.html">Fazer pedido</a></div><div id="orders"></div></div></main>
<script>
const db=supabase.createClient('https://ggdmqffnkpumjwmrqqzi.supabase.co','sb_publishable_FKN_oKLr3Ud0C5p6Sw77Uw_1P8w1hhc'),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function init(){
 const {data:{user}}=await db.auth.getUser();if(!user)return location.href='login.html';
 const {data:profile}=await db.from('perfis').select('nome,role,whatsapp').eq('id',user.id).single();if(profile?.role==='dono')return location.href='admin.html';
 customerName.textContent=profile?.nome||'Cliente';customerPhone.textContent=profile?.whatsapp||'';
 const {data,error}=await db.from('pedidos').select('*').eq('cliente_id',user.id).order('criado_em',{ascending:false});
 if(error)return orders.innerHTML='<p class="muted">Erro ao carregar pedidos.</p>';
 orders.innerHTML=data.length?data.map(p=>`<div class="list-item"><div class="row"><strong>Pedido #${p.numero}</strong><span class="status-pill">${p.status}</span></div><p class="muted">${new Date(p.criado_em).toLocaleString('pt-BR')}</p><strong>${money(p.total)}</strong></div>`).join(''):'<p class="muted">Você ainda não fez pedidos.</p>';
}
async function logout(){await db.auth.signOut();location.href='index.html'}init();
</script></body></html>
