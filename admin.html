<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel PedidoFlow</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f4f4;color:#222}.wrap{max-width:1000px;margin:auto;padding:20px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px}
button{border:0;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:bold}.primary{background:#111;color:white}.danger{background:#b91c1c;color:white}
.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.muted{color:#666;font-size:14px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.item{flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<h1>Painel PedidoFlow</h1>
<p><a href="index.html">Abrir cardápio</a></p>

<section class="card"><h2>Configurações da loja</h2>
<div class="grid">
<input id="storeName" placeholder="Nome da loja"><input id="whatsapp" placeholder="WhatsApp: 5573999999999">
<input id="deliveryFee" type="number" step="0.01" placeholder="Taxa de entrega"><input id="storeAddress" placeholder="Cidade/endereço">
<input id="pixKey" placeholder="Chave Pix"><select id="open"><option value="true">Loja aberta</option><option value="false">Loja fechada</option></select>
</div><button class="primary" style="margin-top:12px" onclick="saveSettings()">Salvar configurações</button></section>

<section class="card"><h2>Cadastrar produto</h2>
<div class="grid">
<input id="name" placeholder="Nome do produto"><input id="price" type="number" step="0.01" placeholder="Preço">
<input id="category" placeholder="Categoria"><input id="image" placeholder="URL da imagem">
<textarea id="description" class="grid" placeholder="Descrição"></textarea>
<select id="active"><option value="true">Ativo</option><option value="false">Oculto</option></select>
</div><button class="primary" style="margin-top:12px" onclick="addProduct()">Adicionar produto</button></section>

<section class="card"><h2>Produtos</h2><div id="list"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ggdmqffnkpumjwmrqqzi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FKN_oKLr3Ud0C5p6Sw77Uw_1P8w1hhc';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let settingsRowId = null;
let products = [];

async function load() {
  const [sRes,pRes] = await Promise.all([
    db.from('configuracoes').select('*').order('id').limit(1).maybeSingle(),
    db.from('produtos').select('*').order('id')
  ]);
  if (sRes.error) alert('Erro nas configurações: '+sRes.error.message);
  if (pRes.error) alert('Erro nos produtos: '+pRes.error.message);
  if (sRes.data) {
    settingsRowId=sRes.data.id; storeName.value=sRes.data.nome_loja||''; whatsapp.value=sRes.data.whatsapp||'';
    deliveryFee.value=sRes.data.taxa_entrega||0; storeAddress.value=sRes.data.endereco||'';
    pixKey.value=sRes.data.chave_pix||''; open.value=String(sRes.data.loja_aberta!==false);
  }
  products=pRes.data||[]; render();
}
async function saveSettings() {
  const data={nome_loja:storeName.value||'PedidoFlow', whatsapp:whatsapp.value.replace(/\D/g,''), taxa_entrega:Number(deliveryFee.value||0), endereco:storeAddress.value, chave_pix:pixKey.value, loja_aberta:open.value==='true', atualizado_em:new Date().toISOString()};
  const query=settingsRowId?db.from('configuracoes').update(data).eq('id',settingsRowId).select().single():db.from('configuracoes').insert(data).select().single();
  const {data:row,error}=await query; if(error)return alert('Erro ao salvar: '+error.message); settingsRowId=row.id; alert('Configurações salvas na nuvem.');
}
async function addProduct() {
  const nameInput = document.getElementById('name');
  const priceInput = document.getElementById('price');
  const categoryInput = document.getElementById('category');
  const imageInput = document.getElementById('image');
  const descriptionInput = document.getElementById('description');
  const activeInput = document.getElementById('active');

  const productName = nameInput.value.trim();
  const normalizedPrice = priceInput.value.replace(',', '.');
  const productPrice = Number(normalizedPrice);

  if (!productName) {
    nameInput.focus();
    return alert('Informe o nome do produto.');
  }

  if (!normalizedPrice || Number.isNaN(productPrice) || productPrice <= 0) {
    priceInput.focus();
    return alert('Informe um preço válido. Exemplo: 18,90');
  }

  const payload = {
    nome: productName,
    preco: productPrice,
    categoria: categoryInput.value.trim() || 'Outros',
    descricao: descriptionInput.value.trim(),
    imagem_url: imageInput.value.trim(),
    ativo: activeInput.value === 'true'
  };

  const { error } = await db.from('produtos').insert(payload);
  if (error) return alert('Erro ao cadastrar: ' + error.message);

  nameInput.value = '';
  priceInput.value = '';
  categoryInput.value = '';
  imageInput.value = '';
  descriptionInput.value = '';
  activeInput.value = 'true';

  alert('Produto cadastrado com sucesso.');
  await reloadProducts();
}
async function reloadProducts() { const {data,error}=await db.from('produtos').select('*').order('id'); if(error)return alert(error.message);products=data||[];render(); }
async function removeProduct(id) { if(!confirm('Excluir este produto?'))return; const {error}=await db.from('produtos').delete().eq('id',id); if(error)return alert(error.message); await reloadProducts(); }
async function toggleProduct(id) { const p=products.find(x=>x.id===id); const {error}=await db.from('produtos').update({ativo:!p.ativo}).eq('id',id); if(error)return alert(error.message); await reloadProducts(); }
function render() {
 list.innerHTML=products.length?products.map(p=>`<div class="item"><div><strong>${p.nome}</strong><div class="muted">${p.categoria||'Outros'} • R$ ${Number(p.preco).toFixed(2)} • ${p.ativo?'Ativo':'Oculto'}</div></div><div><button onclick="toggleProduct(${p.id})">${p.ativo?'Ocultar':'Ativar'}</button> <button class="danger" onclick="removeProduct(${p.id})">Excluir</button></div></div>`).join(''):'<p>Nenhum produto cadastrado.</p>';
}
load();
</script></body></html>
